
name: Deploy PawCare to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          zip -r pawcare.zip . \
            -x ".git/*" \
               "node_modules/*" \
               ".env" \
               ".env.*" \
               "data/*" \
               "uploads/*" \
               ".github/*"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4DD3B433AD154DE091EA7C2A2B6AA5C9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EC114FB3C6CA40B9B2A1F4CEC808D35F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7BE5FF1183884105BEA4C4B99F077250 }}

      - name: Enable build automation
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              --name pawcare \
              --resource-group rg-lab-manohar \
              --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Deploy ZIP package
        uses: azure/webapps-deploy@v3
        with:
          app-name: pawcare
          slot-name: Production
          package: pawcare.zip
